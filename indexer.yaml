# Notes RAG — Indexer Configuration
#
# All paths can be overridden via environment variables:
#   RAG_WORKSPACE    → workspace

workspace: /mnt/Claude
exclude:
  - trash
  - tmp
  - temp
  - docs-archive

chunk_size: 500
chunk_overlap: 100
# bge-small (todo 533): same 384 dims as MiniLM, better retrieval. Embedded text is
# "file | headers | project\ncontent" (embed_prefix). Changing either requires a full
# re-embed (scripts/reembed.py); the service refuses to start against a mismatched DB.
embedding_model: BAAI/bge-small-en-v1.5
embed_prefix: true
embedding_query_prefix: "Represent this sentence for searching relevant passages: "
db_path: /opt/rag/rag.db
rerank: true

watch_extra:
  - /mnt/Obsidian

# Wiki layer — synthesised topic pages (Todo 123 task 1)
# wiki/ pages get a score multiplier in retrieval to surface above raw notes.
# Override via env: WIKI_BOOST=1.5 (default)
wiki_boost: 1.5

# News/filings ingested via POST /ingest are unbounded by default. Set to a
# number of days (or RAG_NEWS_RETENTION_DAYS) to expire older ones hourly.
# news_retention_days: 90
