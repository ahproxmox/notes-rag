name: CI

on:
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax check
        run: python3 -m py_compile api/app.py core/search.py infra/watcher.py core/indexer.py main.py features/research.py

      - name: Bench suite syntax check
        run: python3 -m py_compile bench/run_bench.py bench/score.py

  tests:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set up venv + install deps
        # Venv lives OUTSIDE the workspace: actions/checkout@v4 defaults to
        # clean:true (git clean -ffdx), which would wipe a gitignored in-tree
        # venv/ on every run. On a persistent self-hosted runner ~/.cache
        # survives, so pip only does real work when requirements-dev.txt changes.
        # requirements-dev.txt pulls in requirements.txt plus pytest + httpx.
        run: |
          VENV="$HOME/.cache/notes-rag-ci-venv"
          test -d "$VENV" || python3 -m venv "$VENV"
          "$VENV/bin/pip" install -q --upgrade pip
          "$VENV/bin/pip" install -q -r requirements-dev.txt
          echo "VENV=$VENV" >> "$GITHUB_ENV"

      - name: pytest
        env:
          OPENROUTER_API_KEY: test
        run: "$VENV/bin/python -m pytest tests/ -q"
